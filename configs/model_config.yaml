models:
  logistic_regression:
    enabled: true
    C: 1.0
    solver: "liblinear"
    class_weight: "balanced"
    max_iter: 2000

  random_forest:
    enabled: true
    n_estimators: 400
    max_depth:
    min_samples_split: 4
    min_samples_leaf: 2
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1

  xgboost:
    enabled: true
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    min_child_weight: 2
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.0
    reg_lambda: 1.0
    objective: "binary:logistic"
    eval_metric: "logloss"
    tree_method: "hist"

  svm:
    enabled: true
    kernel: "rbf"
    C: 2.0
    gamma: "scale"
    probability: True
    class_weight: "balanced"

  knn:
    enabled: true
    n_neighbors: 11
    weights: "distance"
    metric: "minkowski"
    p: 2

training:
  cv_folds: 5
  scoring_metric: "roc_auc"
  decision_threshold: 0.5

ensemble:
  voting:
    weight_metric: "roc_auc"
    weight_power: 4.0
    voting: "soft"

  stacking:
    meta_learner: "logistic_regression"
    cv_folds: 5
    passthrough: true
    meta_params:
      C: 1.0
      solver: "lbfgs"
      max_iter: 2000
      class_weight: "balanced"
